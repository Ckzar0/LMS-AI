# 🐳 MASTER ORCHESTRATOR - AI LMS MOODLE
# Unificado: Moodle (PHP), MariaDB e FrontEnd (Next.js)

services:
  # --- DATABASE ---
  db:
    image: mariadb:10.11
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_bin
      --innodb_file_per_table=On
    environment:
      - MYSQL_ROOT_PASSWORD=m@0dl3ing
      - MYSQL_DATABASE=moodle
      - MYSQL_USER=moodle
      - MYSQL_PASSWORD=m@0dl3ing
    volumes:
      - ./moodle-stable/mariadb_data:/var/lib/mysql
      - ./moodle_base_setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro

  # --- MOODLE (WEBSERVER) ---
  webserver:
    image: moodlehq/moodle-php-apache:8.2
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./moodle-stable/moodle:/var/www/html
      - ./Prompts:/var/www/Prompts:ro
      - moodledata:/var/www/moodledata
    environment:
      - MOODLE_DOCKER_RUNNING=1
      - MOODLE_DOCKER_DBTYPE=mariadb
      - MOODLE_DOCKER_DBHOST=db
      - MOODLE_DOCKER_DBNAME=moodle
      - MOODLE_DOCKER_DBUSER=moodle
      - MOODLE_DOCKER_DBPASS=m@0dl3ing
      - MOODLE_DOCKER_WWWROOT=http://localhost:8080
      - MOODLE_DOCKER_PHP_VERSION=8.2

  # --- FRONTEND (NEXT.JS) ---
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    depends_on:
      - webserver
    ports:
      - "3000:3000"
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules
      - /app/.next
      - ./moodle-stable/moodle/public/local/wsmanageactivities/extracted_images:/app/public/extracted_images:ro
      - ./Prompts:/app/Prompts:ro
    environment:
      - NEXT_PUBLIC_MOODLE_URL=http://localhost:8080
      - MOODLE_URL=http://webserver
      - MOODLE_TOKEN=14c68ff68a1a57cdc4cf4d72f443b87d
      - GEMINI_API_KEY=
      - PORTKEY_API_KEY=
      - PORTKEY_MODEL_PRO=@gemini-3-prod/gemini-3-pro-preview
      - PORTKEY_MODEL_FLASH=@gemini-3-prod/gemini-3-flash-preview
      - PORTKEY_MAX_TOKENS=65536
      - NODE_ENV=development
      - NODE_OPTIONS=--dns-result-order=ipv4first

volumes:
  moodledata:
